# Workers with static assets (Cloudflare's recommended setup for new projects).
name = "workbench-pub"
main = "functions/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs first only for /api/* and the four share pages (per-page link-preview meta,
# functions/shareMeta.ts). Everything else, including /assets/*, fonts, /og.png and the favicons,
# is served straight from static assets. `*` matches deeply (so /p/* also covers /p/:did/:rkey/update,
# which the Worker passes through unchanged). Checked by functions/shareMeta.test.ts.
run_worker_first = ["/api/*", "/p/*", "/u/*", "/t/*", "/profile/*"]

# Attaches workbench.pub as a Custom Domain on `wrangler deploy`. Requires workbench.pub to be an active zone
# on Cloudflare (no existing CNAME on the apex). Delete this block to attach the domain in the dashboard instead.
[[routes]]
pattern = "workbench.pub"
custom_domain = true

# Secrets (never put them here): `wrangler secret put ADMIN_TOKEN` and `wrangler secret put IP_HASH_SALT`.
# There are no [vars]; the Worker reads DB, ADMIN_TOKEN and IP_HASH_SALT, plus DEV_PLACEHOLDERS
# (local dev only, set in the gitignored .dev.vars, never in this file).

[[d1_databases]]
binding = "DB"
database_name = "workbench"
database_id = "48a9a751-fd75-4121-8db1-d97dd379d19a"
migrations_dir = "migrations"
