# Workers with static assets (Cloudflare's recommended setup for new projects).
name = "workbench-pub"
main = "functions/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only /api/* runs the Worker; everything else is served from static assets.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "workbench"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `wrangler d1 create workbench`
migrations_dir = "migrations"
