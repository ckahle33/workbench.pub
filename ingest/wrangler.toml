# Cron Worker that drains Jetstream into D1.
name = "workbench-ingest"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# UTC. Workers Free allows 5 Cron Triggers per account and 10 ms CPU per run (see README, Deploying).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "workbench"
database_id = "48a9a751-fd75-4121-8db1-d97dd379d19a"
