<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>workbench.pub share card (1200x630)</title>
<style>
  /* Source for public/og.png. Rendered at exactly 1200x630; see README.md in this folder. */
  @font-face {
    font-family: 'Inter Tight';
    font-weight: 100 900;
    src: url('../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-weight: 500;
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  }
  :root { --ink: #111111; --paper: #ffffff; --muted: #5c5c5c; --accent: #d0201a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: 'Inter Tight', Helvetica, Arial, sans-serif;
    padding: 56px 64px 52px;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
  .wordmark { font-weight: 800; font-size: 40px; letter-spacing: -0.04em; }
  .dot { color: var(--accent); }
  h1 {
    font-weight: 800;
    font-size: 176px;
    line-height: 0.86;
    letter-spacing: -0.06em;
    margin-top: 44px;
    margin-left: -8px;
  }
  .steps { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); }
  .step { padding-top: 16px; display: flex; align-items: baseline; gap: 16px; }
  .step + .step { border-left: 1px solid var(--ink); padding-left: 20px; }
  .num { font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .num.newest { color: var(--accent); }
</style>
</head>
<body>
  <div class="top">
    <div class="wordmark">workbench<span class="dot">.</span>pub</div>
    <div class="mono">Projects as dated timelines</div>
  </div>
  <h1>Show how<br />it’s made<span class="dot">.</span></h1>
  <div class="steps" aria-hidden="true">
    <div class="step"><span class="num">01</span><span class="mono">Parts</span></div>
    <div class="step"><span class="num">02</span><span class="mono">Photos</span></div>
    <div class="step"><span class="num">03</span><span class="mono">Notes</span></div>
    <div class="step"><span class="num newest">04</span><span class="mono">Finished</span></div>
  </div>
</body>
</html>
